<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="icon" type="image/jpeg" href="{{ "/assets/images/favicon.jpg" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/assets/images/favicon.jpg" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
</head>
<body>

  <div class="container">
    <header>
      <a href="{{ "/" | relative_url }}" class="site-title">{{ site.title | default: "Akash Chatterjee" }}</a>
      <nav>
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="current"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | default: "Akash Chatterjee" }}. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
