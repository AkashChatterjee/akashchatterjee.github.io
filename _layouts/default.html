<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="icon" type="image/jpeg" href="{{ "/assets/images/favicon.jpg" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/assets/images/favicon.jpg" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  <script type="application/ld+json">
  {% if page.layout == 'post' %}
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | jsonify }},
    "url": "{{ site.url }}{{ page.url }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": {{ site.author.name | jsonify }},
      "url": {{ site.url | jsonify }}
    },
    "publisher": {
      "@type": "Person",
      "name": {{ site.author.name | jsonify }}
    },
    "isPartOf": {
      "@type": "Blog",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | jsonify }}
    }
  }
  {% elsif page.url == '/' %}
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ site.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": {{ site.url | jsonify }},
    "author": {
      "@type": "Person",
      "name": {{ site.author.name | jsonify }},
      "url": {{ site.url | jsonify }}
    }
  }
  {% else %}
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": "{{ site.url }}{{ page.url }}",
    "isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | jsonify }}
    }
  }
  {% endif %}
  </script>
</head>
<body>

  <div class="container">
    <header>
      <a href="{{ "/" | relative_url }}" class="site-title">{{ site.title | default: "Akash Chatterjee" }}</a>
      <nav>
        {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="current"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | default: "Akash Chatterjee" }}. All rights reserved.</p>
      <p><a href="/sitemap/">Site Map</a></p>
    </footer>
  </div>

  <script>
    document.querySelectorAll('.post-content img').forEach(function(img) {
      img.setAttribute('loading', 'lazy');
    });
  </script>

</body>
</html>
